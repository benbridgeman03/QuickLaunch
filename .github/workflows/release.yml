name: Release

on:
  push:
    tags: ["v*"]

jobs:
  release:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Restore dependencies
        run: dotnet restore
        working-directory: QuickLaunch

      - name: Build
        run: msbuild QuickLaunch.sln /p:Configuration=Release /p:RestorePackages=false
        working-directory: QuickLaunch

      - name: Test
        run: dotnet test --no-build --configuration Release --verbosity normal
        working-directory: QuickLaunch

      - name: Publish
        run: msbuild QuickLaunch.UI/QuickLaunch.UI.csproj /t:Publish /p:Configuration=Release /p:RuntimeIdentifier=win-x64 /p:SelfContained=true /p:PublishDir=..\..\publish
        working-directory: QuickLaunch

      - name: Zip release
        run: Compress-Archive -Path publish/* -DestinationPath QuickLaunch-${{ github.ref_name }}.zip
        shell: pwsh

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: QuickLaunch-${{ github.ref_name }}.zip
          generate_release_notes: true
